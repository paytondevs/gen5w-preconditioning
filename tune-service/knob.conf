# TUNE-knob trigger, verified on this car (Ioniq 5, NEEV23 US) on 2026-10-01:
# pressing TUNE emits EV_KEY code 17 (0x11) values 1/0 on this input device.
# DEVICE_NAME is matched against "N: Name=..." in /proc/bus/input/devices.
DEVICE_NAME=daudio_wp_daudioplus_neev23_us
# EV6 US 260507: raw capture on 2026-10-24 confirmed the same key code,
# on the main cvev input device (not the separately named _knob device).
# Preserve the NEEV23 US (Ioniq 5) default; select only the exact tested EV6 build.
if [ "$(getprop ro.product.device)" = wp_daudioplus_cvev_us ] &&
   [ "$(getprop ro.build.product)" = CVEV.USA.0000.V015.012.260507 ] &&
   [ "$(getprop ro.build.version.sdk)" = 19 ]; then
    DEVICE_NAME=daudio_wp_daudioplus_cvev_us
fi
# EV6 US 251120: porting kit capture on 2026-10-30 showed key 17 on the same main
# daudio_wp_daudioplus_cvev_us device as 260507, not its _can or _knob devices.
if [ "$(getprop ro.product.device)" = wp_daudioplus_cvev_us ] &&
   [ "$(getprop ro.build.product)" = CVEV.USA.0000.V014.011.251120 ] &&
   [ "$(getprop ro.build.version.sdk)" = 19 ]; then
    DEVICE_NAME=daudio_wp_daudioplus_cvev_us
fi
# NEEV US 260507 (US 2022 Ioniq 5): raw capture on 2026-10-27 showed key 17 on the main
# daudio_wp_daudioplus_neev_us device (event1), not its _can or _knob devices.
if [ "$(getprop ro.product.device)" = wp_daudioplus_neev_us ] &&
   [ "$(getprop ro.build.product)" = NEEV.USA.0000.V015.012.260507 ] &&
   [ "$(getprop ro.build.version.sdk)" = 19 ]; then
    DEVICE_NAME=daudio_wp_daudioplus_neev_us
fi
# CEEV US 260507 (US 2023 Ioniq 6): porting kit capture on 2026-10-29 showed key 17 on the
# main daudio_wp_daudioplus_ceev_us device (event1), not its _can or _knob devices.
if [ "$(getprop ro.product.device)" = wp_daudioplus_ceev_us ] &&
   [ "$(getprop ro.build.product)" = CEEV.USA.0000.V015.012.260507 ] &&
   [ "$(getprop ro.build.version.sdk)" = 19 ]; then
    DEVICE_NAME=daudio_wp_daudioplus_ceev_us
fi
KEY_CODE=17
# How long TUNE must be held before the target opens (Hyundai's own long-press is 800 ms).
HOLD_MS=800
# Open Launchpad, registered as /system/app/Launchpad.apk.
TARGET_COMPONENT=com.paytondev.launchpad/.MainActivity
