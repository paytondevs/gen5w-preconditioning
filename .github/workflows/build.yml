# Builds Launchpad on every PR; on every merge to main, signs it with a throwaway
# key, builds the NEMESIS package and USB bundles, and refreshes the draft release
# for the version in VERSION. Never connects to a car.
name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize so two quick merges can't race on the same draft.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v6

      # Gradle and build_usb_bundles.py read the same file and validate it.
      - name: Read version
        run: echo "VERSION=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_ENV"

      # The package writes /system/app/Launchpad.apk directly instead of going
      # through pm install, so each build can be signed with a fresh key.
      - name: Build APK signed with a throwaway key
        run: |
          LAUNCHPAD_KEYSTORE="$RUNNER_TEMP/launchpad.p12"
          LAUNCHPAD_STORE_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$LAUNCHPAD_STORE_PASSWORD"
          export LAUNCHPAD_KEYSTORE LAUNCHPAD_STORE_PASSWORD
          keytool -genkeypair -storetype PKCS12 -keystore "$LAUNCHPAD_KEYSTORE" \
            -storepass:env LAUNCHPAD_STORE_PASSWORD -alias launchpad \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Launchpad CI"
          sh tools/build_apk.sh

      - name: Build NEMESIS package and USB bundles
        run: python3 tools/build_usb_bundles.py

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Launchpad.apk paytondev.launchpad.zip Launchpad-install-usb.zip \
            Launchpad-port-kit-usb.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: launchpad-${{ env.VERSION }}-${{ github.sha }}
          path: |
            dist/Launchpad.apk
            dist/paytondev.launchpad.zip
            dist/Launchpad-install-usb.zip
            dist/Launchpad-port-kit-usb.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # One rolling draft per VERSION. Published releases are never touched.
      - name: Update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          assets="dist/Launchpad.apk dist/paytondev.launchpad.zip dist/Launchpad-install-usb.zip dist/Launchpad-port-kit-usb.zip dist/SHA256SUMS.txt"
          draft=$(gh release list --limit 100 --json tagName,isDraft \
            --jq "[.[] | select(.tagName == \"$tag\") | .isDraft | tostring][0] // empty")
          if [ "$draft" = "false" ]; then
            echo "::warning::$tag is already published; bump VERSION to start a new draft. Build is in the workflow artifacts."
          elif [ "$draft" = "true" ]; then
            gh release edit "$tag" --target "$GITHUB_SHA"
            gh release upload "$tag" $assets --clobber
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Launchpad $VERSION" --generate-notes $assets
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/launchpad.p12"
